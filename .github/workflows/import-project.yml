name: Import prepared IMU-OMC archive
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-prepared-project
  cancel-in-progress: false
jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'project-archive-2026-11-26'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/project-download" "$RUNNER_TEMP/project-import"
          gh release download project-archive-2026-11-26 --repo "$GITHUB_REPOSITORY" --pattern 'imu-omc-kinematic-validation.zip' --dir "$RUNNER_TEMP/project-download"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'project-download/imu-omc-kinematic-validation.zip'
          expected = 'ac8ab36e858b7949efdde5f1a063e3a32935943a7e1c9319a90ee6fd57b8b726'
          assert hashlib.sha256(source.read_bytes()).hexdigest() == expected, 'Archive checksum mismatch'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'project-import'
          with zipfile.ZipFile(source) as archive:
              for info in archive.infolist():
                  parts = pathlib.PurePosixPath(info.filename).parts
                  assert parts and not pathlib.PurePosixPath(info.filename).is_absolute()
                  assert '..' not in parts and '.git' not in parts and '.github' not in parts
              archive.extractall(target)
          entries = json.loads((target / 'CHECKSUMS.json').read_text())
          assert len(entries) == 313
          for item in entries:
              path = target / item['path']
              assert path.stat().st_size == item['size'], item['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256'], item['path']
          assert len([p for p in target.rglob('*') if p.is_file()]) == 314
          print('Verified archive SHA-256 and all 314 project files.')
          PY
      - name: Commit project files to main
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" "$RUNNER_TEMP/project-repository" -- --depth=1 --branch=main
          cd "$RUNNER_TEMP/project-repository"
          if test -f CHECKSUMS.json; then
            echo 'Project already imported; refusing to overwrite subsequent work.'
            exit 0
          fi
          cp -a "$RUNNER_TEMP/project-import/." .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force .
          git commit -m "Add complete IMU-OMC project, source data, reports and reproducibility documentation"
          git push origin HEAD:main
